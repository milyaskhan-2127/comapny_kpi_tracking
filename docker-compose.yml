# ============================================================================
# Productix ERP — Docker Compose (Frappe/ERPNext v15)
#
# Productix is modular, and this file deliberately contains NO module names.
# Every app found under ./apps is mounted and made importable at container
# start; which of them get INSTALLED on a given site is chosen at setup time
# (PRODUCTIX_APPS in .env, or full discovery when it is unset) - see
# setup_site.ps1 / setup_site.sh - with the module registry handling runtime
# enable/disable.
# (The legacy monolith was retired; see tag `pre-legacy-retirement` and
# docs/migration.md for rolling an existing legacy database forward.)
# ============================================================================

# ---------------------------------------------------------------------------
# Module source tree - ONE mount, never one per app.
#
# ./apps is staged at /opt/productix-apps; docker/productix-apps.sh (sourced
# by every python service at start) links whatever it finds there into the
# bench's apps/ tree, exports PYTHONPATH, and rewrites a .pth in
# site-packages so `docker compose exec` shells can import them too. This
# replaces the old hard-coded four-app bind mounts and the static
# PYTHONPATH anchor.
#
# Adding a module = adding a folder under ./apps. Zero edits to this file.
# ---------------------------------------------------------------------------
x-productix-source: &productix-source ./apps:/opt/productix-apps
x-productix-shim: &productix-shim ./docker/productix-apps.sh:/usr/local/bin/productix-apps.sh:ro

# The queue and scheduler services have no custom script of their own, so
# they get this wrapper instead: source the module shim (PYTHONPATH must be
# in place before any python starts), then hand the original command to the
# image's own entrypoint. `$$` is compose escaping - the container really
# sees `$0` / `$@`, i.e. the `command:` below.
x-python-entrypoint: &python-entrypoint
  - sh
  - -c
  - tr -d '\r' < /usr/local/bin/productix-apps.sh > /tmp/productix-apps.sh && . /tmp/productix-apps.sh && exec /usr/local/bin/entrypoint.sh "$$0" "$$@"

# The `assets` volume MUST be mounted at the image's baked path
# (/home/frappe/frappe-bench/assets), never at sites/assets.
#
# The frappe image's /usr/local/bin/entrypoint.sh runs on every container and
# does `rm -rf sites/assets && ln -s <baked> sites/assets`. sites/assets is
# therefore rewritten on every start; if it were a mount point, that `rm`
# fails with "Device or resource busy" and backend + frontend crash-loop
# forever. Mounting the volume at the baked path instead makes
# sites/assets a plain symlink inside the shared `sites` volume, which is
# stable on every host — and lets Docker seed a fresh volume with the baked
# frappe/erpnext bundles so nginx works before the first `bench build`.
x-backend-volumes: &backend-volumes
  - sites:/home/frappe/frappe-bench/sites
  - logs:/home/frappe/frappe-bench/logs
  - assets:/home/frappe/frappe-bench/assets
  - *productix-source
  - *productix-shim

services:
  configurator:
    image: frappe/erpnext:v15.121.3
    restart: "no"
    entrypoint:
      - sh
      - -c
      - tr -d '\r' < /usr/local/bin/configurator.sh > /tmp/configurator.sh && exec sh /tmp/configurator.sh
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
      SITE_NAME: ${SITE_NAME:-productix.local}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - assets:/home/frappe/frappe-bench/assets
      - *productix-source
      - *productix-shim
      - ./docker/configurator.sh:/usr/local/bin/configurator.sh:ro
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  backend:
    image: frappe/erpnext:v15.121.3
    restart: unless-stopped
    # `tr -d '\r'` neutralises CRLF line endings a Windows checkout may have
    # introduced, so the script always runs with LF endings regardless of the
    # host's `core.autocrlf` setting.
    command:
      - sh
      - -c
      - tr -d '\r' < /usr/local/bin/backend-entrypoint.sh > /tmp/backend-entrypoint.sh && exec sh /tmp/backend-entrypoint.sh
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
      SITE_NAME: ${SITE_NAME:-productix.local}
      PRODUCTIX_APPS: ${PRODUCTIX_APPS:-}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - assets:/home/frappe/frappe-bench/assets
      - *productix-source
      - *productix-shim
      - ./docker/backend-entrypoint.sh:/usr/local/bin/backend-entrypoint.sh:ro
    depends_on:
      configurator:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  frontend:
    image: frappe/erpnext:v15.121.3
    restart: unless-stopped
    # `tr -d '\r'` neutralises CRLF line endings a Windows checkout may have
    # introduced — see the note on the backend service.
    command:
      - sh
      - -c
      - tr -d '\r' < /usr/local/bin/frontend-entrypoint.sh > /tmp/frontend-entrypoint.sh && exec sh /tmp/frontend-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-productix.local}
      NGINX_SITE_NAME: ${SITE_NAME:-productix.local}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - assets:/home/frappe/frappe-bench/assets
      - ./nginx.conf.template:/etc/nginx/conf.d/frappe.conf.template:ro
      - ./docker/frontend-entrypoint.sh:/usr/local/bin/frontend-entrypoint.sh:ro
    ports:
      - "8080:8080"
    depends_on:
      - backend
      - websocket

  websocket:
    image: frappe/erpnext:v15.121.3
    restart: unless-stopped
    command: node /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      - FRAPPE_REDIS_CACHE=redis://redis-cache:6379
      - FRAPPE_REDIS_QUEUE=redis://redis-queue:6379
      - FRAPPE_SOCKETIO_PORT=9000
      - SOCKETIO_PORT=9000
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully
      redis-queue:
        condition: service_started

  queue-short:
    image: frappe/erpnext:v15.121.3
    restart: unless-stopped
    entrypoint: *python-entrypoint
    command: ["bench", "worker", "--queue", "short,default"]
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
    volumes: *backend-volumes
    depends_on:
      configurator:
        condition: service_completed_successfully
      redis-queue:
        condition: service_started

  queue-long:
    image: frappe/erpnext:v15.121.3
    restart: unless-stopped
    entrypoint: *python-entrypoint
    command: ["bench", "worker", "--queue", "long,default"]
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
    volumes: *backend-volumes
    depends_on:
      configurator:
        condition: service_completed_successfully
      redis-queue:
        condition: service_started

  scheduler:
    image: frappe/erpnext:v15.121.3
    restart: unless-stopped
    entrypoint: *python-entrypoint
    command: ["bench", "schedule"]
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
    volumes: *backend-volumes
    depends_on:
      configurator:
        condition: service_completed_successfully
      redis-queue:
        condition: service_started

  mariadb:
    image: mariadb:10.6
    restart: unless-stopped
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --innodb-log-file-size=64M
      - --innodb-flush-method=O_DIRECT
      - --wait-timeout=28800
      - --interactive-timeout=28800
    healthcheck:
      test: mysqladmin ping -h localhost --password=$${MYSQL_ROOT_PASSWORD}
      interval: 1s
      retries: 20
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-cache-data:/data

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

volumes:
  db-data:
  redis-cache-data:
  redis-queue-data:
  sites:
  logs:
  assets: