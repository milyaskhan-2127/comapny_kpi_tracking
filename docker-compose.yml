services:
  configurator:
    image: frappe/erpnext:v15.121.3
    restart: "no"
    entrypoint:
      - bash
      - -c
      - >
        bench set-config -g db_host mariadb;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache redis://redis-cache:6379;
        bench set-config -g redis_queue redis://redis-queue:6379;
        bench set-config -g redis_socketio redis://redis-queue:6379;
        bench set-config -gp socketio_port 9000;
        bench set-config -g default_site productix.local;
        bench set-config -g allow_cors "*";
        ln -sfn /home/frappe/frappe-bench/apps/frappe/frappe/public /home/frappe/frappe-bench/sites/assets/frappe;
        ln -sfn /home/frappe/frappe-bench/apps/erpnext/erpnext/public /home/frappe/frappe-bench/sites/assets/erpnext;
        ln -sfn /home/frappe/frappe-bench/apps/productix/productix/public /home/frappe/frappe-bench/sites/assets/productix;
        ln -sfn /home/frappe/frappe-bench/apps/frappe/node_modules /home/frappe/frappe-bench/apps/frappe/frappe/public/node_modules;
        ln -sfn /home/frappe/frappe-bench/apps/erpnext/node_modules /home/frappe/frappe-bench/apps/erpnext/erpnext/public/node_modules;
        python3 -c "import os, json, re; a, r = {}, {}; [a.update({f'{m.group(1)}.{m.group(3)}': f'/assets/{app}/dist/{sub}/{f}' for sub in ['js', 'css'] if os.path.exists(f'/home/frappe/frappe-bench/apps/{app}/{app}/public/dist/{sub}') for f in os.listdir(f'/home/frappe/frappe-bench/apps/{app}/{app}/public/dist/{sub}') if not f.endswith('.map') and (m := re.match(r'^(.+)\.([A-Z0-9]{8})\.(js|css)$$', f))}) for app in ['frappe', 'erpnext'] if os.path.exists(f'/home/frappe/frappe-bench/apps/{app}/{app}/public/dist')]; [r.update({f'rtl_{m.group(1)}.css': f'/assets/{app}/dist/css-rtl/{f}' for f in os.listdir(f'/home/frappe/frappe-bench/apps/{app}/{app}/public/dist/css-rtl') if not f.endswith('.map') and (m := re.match(r'^(.+)\.([A-Z0-9]{8})\.css$$', f))}) for app in ['frappe', 'erpnext'] if os.path.exists(f'/home/frappe/frappe-bench/apps/{app}/{app}/public/dist/css-rtl')]; json.dump(a, open('/home/frappe/frappe-bench/sites/assets/assets.json', 'w'), indent=2); json.dump(r, open('/home/frappe/frappe-bench/sites/assets/assets-rtl.json', 'w'), indent=2)";
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - assets:/home/frappe/frappe-bench/sites/assets
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  backend:
    image: frappe/erpnext:v15.121.3
    restart: unless-stopped
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - REDIS_CACHE=redis-cache:6379
      - REDIS_QUEUE=redis-queue:6379
      - SOCKETIO_PORT=9000
      - PYTHONPATH=/home/frappe/frappe-bench/apps/productix
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - assets:/home/frappe/frappe-bench/sites/assets
      - ./apps/productix:/home/frappe/frappe-bench/apps/productix
    depends_on:
      configurator:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  frontend:
    image: frappe/erpnext:v15.121.3
    restart: unless-stopped
    command: nginx -g 'daemon off;'
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME_HEADER:-productix.local}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - assets:/home/frappe/frappe-bench/sites/assets
      - ./apps/productix:/home/frappe/frappe-bench/apps/productix:ro
      - ./nginx.conf:/etc/nginx/conf.d/frappe.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - backend
      - websocket

  websocket:
    image: frappe/erpnext:v15.121.3
    restart: unless-stopped
    command: node /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      - FRAPPE_REDIS_CACHE=redis://redis-cache:6379
      - FRAPPE_REDIS_QUEUE=redis://redis-queue:6379
      - FRAPPE_SOCKETIO_PORT=9000
      - SOCKETIO_PORT=9000
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully
      redis-queue:
        condition: service_started

  queue-short:
    image: frappe/erpnext:v15.121.3
    restart: unless-stopped
    command: bench worker --queue short,default
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - REDIS_CACHE=redis-cache:6379
      - REDIS_QUEUE=redis-queue:6379
      - PYTHONPATH=/home/frappe/frappe-bench/apps/productix
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ./apps/productix:/home/frappe/frappe-bench/apps/productix
    depends_on:
      configurator:
        condition: service_completed_successfully
      redis-queue:
        condition: service_started

  queue-long:
    image: frappe/erpnext:v15.121.3
    restart: unless-stopped
    command: bench worker --queue long,default
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - REDIS_CACHE=redis-cache:6379
      - REDIS_QUEUE=redis-queue:6379
      - PYTHONPATH=/home/frappe/frappe-bench/apps/productix
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ./apps/productix:/home/frappe/frappe-bench/apps/productix
    depends_on:
      configurator:
        condition: service_completed_successfully
      redis-queue:
        condition: service_started

  scheduler:
    image: frappe/erpnext:v15.121.3
    restart: unless-stopped
    command: bench schedule
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - REDIS_CACHE=redis-cache:6379
      - REDIS_QUEUE=redis-queue:6379
      - PYTHONPATH=/home/frappe/frappe-bench/apps/productix
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ./apps/productix:/home/frappe/frappe-bench/apps/productix
    depends_on:
      configurator:
        condition: service_completed_successfully
      redis-queue:
        condition: service_started

  mariadb:
    image: mariadb:10.6
    restart: unless-stopped
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --innodb-log-file-size=64M
      - --innodb-flush-method=O_DIRECT
      - --wait-timeout=28800
      - --interactive-timeout=28800
    healthcheck:
      test: mysqladmin ping -h localhost --password=$${MYSQL_ROOT_PASSWORD}
      interval: 1s
      retries: 20
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-cache-data:/data

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

volumes:
  db-data:
  redis-cache-data:
  redis-queue-data:
  sites:
  logs:
  assets:
