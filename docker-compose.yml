# ============================================================================
# Productix ERP — Docker Compose (Frappe/ERPNext v15)
#
# Productix is modular. The four productix apps (core, recipe, kpi,
# instruction) are always mounted so any combination can be installed on a
# site. Which apps are INSTALLED on a given site is selected at setup time —
# see setup_site.ps1 / setup_site.sh (PRODUCTIX_APPS), and the module
# registry (productix_core) for runtime enable/disable.
#
# The legacy monolithic `productix` app stays mounted for the documented
# migration path (existing DBs migrate first, then retire the old app).
# ============================================================================

x-python-apps: &python-apps
  PYTHONPATH: /home/frappe/frappe-bench/apps/productix_core:/home/frappe/frappe-bench/apps/productix_recipe:/home/frappe/frappe-bench/apps/productix_kpi:/home/frappe/frappe-bench/apps/productix_instruction:/home/frappe/frappe-bench/apps/productix

x-productix-app-volumes: &productix-app-volumes
  - ./apps/productix_core:/home/frappe/frappe-bench/apps/productix_core
  - ./apps/productix_recipe:/home/frappe/frappe-bench/apps/productix_recipe
  - ./apps/productix_kpi:/home/frappe/frappe-bench/apps/productix_kpi
  - ./apps/productix_instruction:/home/frappe/frappe-bench/apps/productix_instruction
  # legacy (migration only) — retire after migrating an existing database
  - ./apps/productix:/home/frappe/frappe-bench/apps/productix

x-backend-volumes: &backend-volumes
  - sites:/home/frappe/frappe-bench/sites
  - logs:/home/frappe/frappe-bench/logs
  - assets:/home/frappe/frappe-bench/sites/assets
  - ./apps/productix_core:/home/frappe/frappe-bench/apps/productix_core
  - ./apps/productix_recipe:/home/frappe/frappe-bench/apps/productix_recipe
  - ./apps/productix_kpi:/home/frappe/frappe-bench/apps/productix_kpi
  - ./apps/productix_instruction:/home/frappe/frappe-bench/apps/productix_instruction
  # legacy (migration only)
  - ./apps/productix:/home/frappe/frappe-bench/apps/productix

services:
  configurator:
    image: frappe/erpnext:v15.121.3
    restart: "no"
    entrypoint:
      - bash
      - -c
      - >
        bench set-config -g db_host mariadb;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache redis://redis-cache:6379;
        bench set-config -g redis_queue redis://redis-queue:6379;
        bench set-config -g redis_socketio redis://redis-queue:6379;
        bench set-config -gp socketio_port 9000;
        bench set-config -g default_site ${SITE_NAME:-productix.local};
        bench set-config -g allow_cors "*";
        # frappe/erpnext assets must be REAL directories inside the shared
        # "assets" volume so that (a) nginx serves bundles from the volume and
        # (b) `bench build` output written under sites/assets is visible to the
        # frontend container. If a previous configurator leaked a symlink,
        # replace it with a real copy (idempotent: no-op when already a dir).
        if [ -L /home/frappe/frappe-bench/sites/assets/frappe ]; then rm /home/frappe/frappe-bench/sites/assets/frappe && cp -a /home/frappe/frappe-bench/apps/frappe/frappe/public /home/frappe/frappe-bench/sites/assets/frappe; fi;
        if [ -L /home/frappe/frappe-bench/sites/assets/erpnext ]; then rm /home/frappe/frappe-bench/sites/assets/erpnext && cp -a /home/frappe/frappe-bench/apps/erpnext/erpnext/public /home/frappe/frappe-bench/sites/assets/erpnext; fi;
        # productix apps serve source assets through symlinks into the mounted
        # app trees (frontend mounts the apps so these resolve).
        ln -sfn /home/frappe/frappe-bench/apps/productix_core/productix_core/public /home/frappe/frappe-bench/sites/assets/productix_core;
        ln -sfn /home/frappe/frappe-bench/apps/productix_recipe/productix_recipe/public /home/frappe/frappe-bench/sites/assets/productix_recipe;
        ln -sfn /home/frappe/frappe-bench/apps/productix_kpi/productix_kpi/public /home/frappe/frappe-bench/sites/assets/productix_kpi;
        ln -sfn /home/frappe/frappe-bench/apps/productix_instruction/productix_instruction/public /home/frappe/frappe-bench/sites/assets/productix_instruction;
        ln -sfn /home/frappe/frappe-bench/apps/productix/productix/public /home/frappe/frappe-bench/sites/assets/productix;
        ln -sfn /home/frappe/frappe-bench/apps/frappe/node_modules /home/frappe/frappe-bench/apps/frappe/frappe/public/node_modules;
        ln -sfn /home/frappe/frappe-bench/apps/erpnext/node_modules /home/frappe/frappe-bench/apps/erpnext/erpnext/public/node_modules;
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
      SITE_NAME: ${SITE_NAME:-productix.local}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - assets:/home/frappe/frappe-bench/sites/assets
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  backend:
    image: frappe/erpnext:v15.121.3
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
      <<: *python-apps
    volumes: *backend-volumes
    depends_on:
      configurator:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  frontend:
    image: frappe/erpnext:v15.121.3
    restart: unless-stopped
    command: sh /usr/local/bin/frontend-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-productix.local}
      NGINX_SITE_NAME: ${SITE_NAME:-productix.local}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - ./apps/productix_core:/home/frappe/frappe-bench/apps/productix_core
      - ./apps/productix_recipe:/home/frappe/frappe-bench/apps/productix_recipe
      - ./apps/productix_kpi:/home/frappe/frappe-bench/apps/productix_kpi
      - ./apps/productix_instruction:/home/frappe/frappe-bench/apps/productix_instruction
      # legacy (migration only)
      - ./apps/productix:/home/frappe/frappe-bench/apps/productix
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - assets:/home/frappe/frappe-bench/sites/assets
      - ./nginx.conf.template:/etc/nginx/conf.d/frappe.conf.template:ro
      - ./docker/frontend-entrypoint.sh:/usr/local/bin/frontend-entrypoint.sh:ro
    ports:
      - "8080:8080"
    depends_on:
      - backend
      - websocket

  websocket:
    image: frappe/erpnext:v15.121.3
    restart: unless-stopped
    command: node /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      - FRAPPE_REDIS_CACHE=redis://redis-cache:6379
      - FRAPPE_REDIS_QUEUE=redis://redis-queue:6379
      - FRAPPE_SOCKETIO_PORT=9000
      - SOCKETIO_PORT=9000
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully
      redis-queue:
        condition: service_started

  queue-short:
    image: frappe/erpnext:v15.121.3
    restart: unless-stopped
    command: bench worker --queue short,default
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      <<: *python-apps
    volumes: *backend-volumes
    depends_on:
      configurator:
        condition: service_completed_successfully
      redis-queue:
        condition: service_started

  queue-long:
    image: frappe/erpnext:v15.121.3
    restart: unless-stopped
    command: bench worker --queue long,default
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      <<: *python-apps
    volumes: *backend-volumes
    depends_on:
      configurator:
        condition: service_completed_successfully
      redis-queue:
        condition: service_started

  scheduler:
    image: frappe/erpnext:v15.121.3
    restart: unless-stopped
    command: bench schedule
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      <<: *python-apps
    volumes: *backend-volumes
    depends_on:
      configurator:
        condition: service_completed_successfully
      redis-queue:
        condition: service_started

  mariadb:
    image: mariadb:10.6
    restart: unless-stopped
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --innodb-log-file-size=64M
      - --innodb-flush-method=O_DIRECT
      - --wait-timeout=28800
      - --interactive-timeout=28800
    healthcheck:
      test: mysqladmin ping -h localhost --password=$${MYSQL_ROOT_PASSWORD}
      interval: 1s
      retries: 20
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-cache-data:/data

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

volumes:
  db-data:
  redis-cache-data:
  redis-queue-data:
  sites:
  logs:
  assets: